gamification.defaultProgram.rule.sendKudos.title=Inviare un Kudo
gamification.defaultProgram.rule.sendKudos.description=Riconosca i Suoi colleghi per i loro contributi inviando loro kudos.<br>Si congratuli con qualcuno per il lavoro svolto. Ringrazi per la condivisione delle conoscenze.<br>Metta in evidenza il lavoro della comunità e la collaborazione, in modo da valorizzare i Suoi colleghi. Sia sincero: conservi i Suoi Kudos per chi merita davvero di essere lodato. Renda speciale questo momento!

gamification.defaultProgram.rule.receiveKudos.title=Ricevi Kudos
gamification.defaultProgram.rule.receiveKudos.description=Ha ricevuto kudos da persone della comunità. Sta ottenendo valore e costruendo la Sua reputazione. Continui così!<br>Non si accordi con gli amici per ricevere kudos. Sia sincero con i Suoi kudos: li conservi per chi merita davvero di essere lodato.

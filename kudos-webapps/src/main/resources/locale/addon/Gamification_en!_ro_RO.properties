gamification.defaultProgram.rule.sendKudos.title=Trimite Kudos
gamification.defaultProgram.rule.sendKudos.description=Recunoaște colegii tăi pentru contribuțiile lor trimițându-le kudos.<br>Felicită pe cineva pentru munca depusă. Mulțumesc oamenilor pentru împărtășirea cunoștințelor.<br>Evidențiază munca comunității, o colaborare astfel încât colegii tăi să aprecieze. Fii sincer, salvează-ți Kudo-urile pentru cineva care merită să fie lăudat. Fă-le un moment special!

gamification.defaultProgram.rule.receiveKudos.title=Primește Kudos
gamification.defaultProgram.rule.receiveKudos.description=Ai primit kudo-uri de la oameni comunitari. Ești apreciat și îți construiești reputația. Continuă!<br>Nu te complota pentru a primi Kudos cu prietenii. Fii sincer cu kudo-urile tale, salvează-le pentru cineva care chiar merită să fie lăudat.

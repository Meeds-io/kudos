gamification.defaultProgram.rule.sendKudos.title=Poslat Kudos
gamification.defaultProgram.rule.sendKudos.description=Rozpoznejte své kolegy za jejich příspěvky odesláním kudos.<br>Blahopřeji někomu za odvedenou práci. Děkujeme za sdílení znalostí.<br>Zvýrazněte práci komunity, spolupráci, aby ocenili vaše partnery. Buďte upřímní, ušetřete své Kuvajty za někoho, kdo si zaslouží pochvalu. Udělejte to zvláštní chvíli!

gamification.defaultProgram.rule.receiveKudos.title=Dostávat kudos
gamification.defaultProgram.rule.receiveKudos.description=Obdrželi jste kudos od komunitních lidí. Získáváte ocenění a budujete si svou reputaci. Pokračujte!<br>Nesnášejte přijímat Kúda s přáteli. Buďte upřímní s tvými kudoy, zachraň je za někoho, kdo si zaslouží pochvalu.

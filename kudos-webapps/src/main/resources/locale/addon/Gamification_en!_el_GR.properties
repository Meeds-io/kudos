gamification.defaultProgram.rule.sendKudos.title=Στείλτε συγχαρητήρια
gamification.defaultProgram.rule.sendKudos.description=Αναγνωρίστε τους συνομηλίκους σας για τις συνεισφορές τους στέλνοντάς τους συγχαρητήρια. <br>Συγχαρείτε κάποιον για το έργο που έχει γίνει. Ευχαριστήστε τους ανθρώπους για την ανταλλαγή γνώσεων. <br>Αναδείξτε την κοινοτική εργασία, μια συνεργασία έτσι ώστε να εκτιμάτε τους συνομηλίκους σας. Κάντε το μια ξεχωριστή στιγμή!

gamification.defaultProgram.rule.receiveKudos.title=Λήψη Kudos
gamification.defaultProgram.rule.receiveKudos.description=Έχετε λάβει συγχαρητήρια από ανθρώπους της κοινότητας. Παίρνετε αξία και χτίζετε τη φήμη σας. Συνέχισε να πηγαίνεις!

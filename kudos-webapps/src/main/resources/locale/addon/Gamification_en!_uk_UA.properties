gamification.defaultProgram.rule.sendKudos.title=Надіслати Похвалу
gamification.defaultProgram.rule.sendKudos.description=Визнайте пірів для своїх внесків, надіславши їх kudos.<br>Вітайте удосконалення виконаного роботи. Дякуємо, що поділилися знаннями.<br>Відмітьте роботу громади, співпрацю, щоб вона цінувала своїх однолітків. Будьте щирими, врятуйте свого Кудоу для когось, хто заслуговує на похвалу. Зробіть це особливим момент!


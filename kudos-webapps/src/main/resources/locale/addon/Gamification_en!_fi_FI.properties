gamification.defaultProgram.rule.sendKudos.title=Lähetä kiitosta
gamification.defaultProgram.rule.sendKudos.description=Tunnista ikäisesi heidän osuutensa lähettämällä heille kudos.<br>Onnittelen jotakuta tehdystä työstä. Kiitos tiedon jakamisesta.<br>Korosta yhteisön työ, yhteistyö, jotta voit arvostaa vertaistasi. Ole vilpitön, pelasta Kudos joku, joka ansaitsee ylistyksen. Tee siitä erityinen hetki!

gamification.defaultProgram.rule.receiveKudos.title=Vastaanota Kudos
gamification.defaultProgram.rule.receiveKudos.description=Olet saanut kudoksia yhteisöllisiltä ihmisiltä. Olet saamassa arvostusta ja rakentamassa mainettasi. Pysy menossa!<br>Älä collude vastaanottaa Kudos ystävien kanssa. Ole vilpitön kudos, pelasta ne joku, joka todella ansaitsee kiitosta.

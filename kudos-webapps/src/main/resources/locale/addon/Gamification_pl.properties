gamification.defaultProgram.rule.sendKudos.title=Wyślij Pozdrowienia
gamification.defaultProgram.rule.sendKudos.description=Rozpoznaj swoich rówieśników za ich wkład, wysyłając im kudoty.<br>Gratuluję kogoś wykonanej pracy. Dziękujemy za dzielenie się wiedzą.<br>Podświetl pracę społeczności, współpracę, aby docenić Twoje rówieśniki. Bądź szczerzy, uratuj swoje Kdos dla kogoś, kto zasługuje na pochwałę. Zrób to wyjątkowym momentem!

gamification.defaultProgram.rule.receiveKudos.title=Otrzymuj kudos
gamification.defaultProgram.rule.receiveKudos.description=Otrzymałeś(aś) kudozy od społeczności ludzi. Otrzymujesz wartość i budujesz swoją reputację. Tak dalej!<br>Nie zmowuj się otrzymywać Kdos ze znajomymi. Bądź szczery ze swoimi kudami, uratuj je dla kogoś, kto zasługuje na pochwałę.

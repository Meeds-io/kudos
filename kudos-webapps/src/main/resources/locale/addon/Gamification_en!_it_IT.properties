gamification.defaultProgram.rule.sendKudos.title=Inviare un Kudo
gamification.defaultProgram.rule.sendKudos.description=Riconosci i tuoi coetanei per i loro contributi, inviandoli loro kudos.<br>Congratulati con qualcuno per il lavoro svolto. Grazie per la condivisione delle conoscenze.<br>Evidenzia il lavoro della comunità, una collaborazione in modo che valorizzi i tuoi coetanei. Sii sincero, salva il tuo Kudos per qualcuno che merita di essere lodato. Fai un momento speciale!

gamification.defaultProgram.rule.receiveKudos.title=Ricevi Kudos
gamification.defaultProgram.rule.receiveKudos.description=Hai ricevuto kudos da persone della comunità. Stai ottenendo valore e costruendo la tua reputazione. Continua ad andare!<br>Non colludere per ricevere il kudos con gli amici. Sii sincero con i tuoi kudos, salvali per qualcuno che merita davvero di essere lodato.

gamification.defaultProgram.rule.sendKudos.title=Stuur Kudos
gamification.defaultProgram.rule.sendKudos.description=Herken uw collega's voor hun bijdragen door hen kudos te sturen.<br>Gefeliciteerd iemand voor het werk gedaan. Bedankt voor het delen van kennis.<br>Markeert de gemeenschap werken, een samenwerking zodat je gebruikers waardeert. Wees eerlijk, bewaar je Kudos voor iemand die het verdient te worden geprezen. Maak het een speciaal moment!

gamification.defaultProgram.rule.receiveKudos.title=Ontvang Kudos
gamification.defaultProgram.rule.receiveKudos.description=Je hebt kudos ontvangen van communitymensen. Je wordt gewaardeerd en je reputatie opbouwen. Blijf gaan!<br>Werk niet samen om Kudos met vrienden te ontvangen. Wees oprecht met je kudos, bewaar ze voor iemand die echt geprezen moet worden.

gamification.defaultProgram.rule.sendKudos.title=Skicka Kudos
gamification.defaultProgram.rule.sendKudos.description=Känn igen dina kamrater för deras bidrag genom att skicka dem kudos.<br>Grattis någon för det arbete som utförts. Tack för att du delade kunskap.<br>Markera det gemensamma arbetet, ett samarbete som värdesätter dina kamrater. Var uppriktig, rädda dina Kudos för någon som förtjänar att lovordas. Gör det till ett speciellt ögonblick!

gamification.defaultProgram.rule.receiveKudos.title=Ta emot Kudos
gamification.defaultProgram.rule.receiveKudos.description=Du har fått högskolepoäng från människor i samhället. Du blir uppskattad och bygger ditt rykte. Fortsätt gå!<br>Ta inte emot Kudos med vänner. Var uppriktig med dina kudos, rädda dem för någon som verkligen förtjänar beröm.

gamification.defaultProgram.rule.sendKudos.title=Kirim pujian
gamification.defaultProgram.rule.sendKudos.description=Hargai rekan Anda atas kontribusinya dengan mengirimkan pujian kepada mereka.<br>Ucapkan selamat kepada seseorang atas pekerjaan yang telah diselesaikan. Ucapkan terima kasih kepada orang-orang yang telah berbagi pengetahuan.<br>Soroti kerja komunitas, sebuah kolaborasi sehingga menghargai rekan-rekan Anda. Ikhlaslah, simpan pujianmu untuk seseorang yang pantas dipuji. Jadikan itu momen spesial!

gamification.defaultProgram.rule.receiveKudos.title=Terima pujian
gamification.defaultProgram.rule.receiveKudos.description=Anda telah menerima pujian dari masyarakat. Anda semakin dihargai dan membangun reputasi Anda. Lanjutkan!<br>Jangan berkolusi untuk menerima Kudos bersama teman. Bersikaplah tulus dengan pujianmu, simpanlah untuk seseorang yang benar-benar pantas dipuji.
